    <script>
      // Before first paint: saved theme (no flash), and whether the prerendered content belongs to this URL.
      // The offline cache serves one HTML file for every route, so a mismatch shows the splash instead.
      (function () {
        var d = document.documentElement;
        try {
          var t = JSON.parse(localStorage.getItem("rekiya.theme.v1") || '"system"');
          if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) d.classList.add("dark");
        } catch (e) {}
        var norm = function (p) {
          return (p || "").replace(/\/+$/, "") || "/";
        };
        if (!d.dataset.pr || norm(d.dataset.pr) !== norm(location.pathname) || location.hash.indexOf("#/") === 0)
          d.classList.add("pr-miss");
      })();
    </script>
    <style>
      /* Boot preloader: a progress bar while the app starts, and a splash when there's nothing prerendered to show. */
      #boot-bar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 3px;
        z-index: 60;
        overflow: hidden;
        background: rgba(18, 55, 96, 0.15);
      }
      #boot-bar::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(90deg, #fbbf24, #86a9d8);
        animation: boot-bar 1.1s ease-in-out infinite;
      }
      @keyframes boot-bar {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      #boot-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f8fafc;
        color: #123760;
        font:
          600 15px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .dark #boot-splash {
        background: #020617;
        color: #d9e5f4;
      }
      #boot-splash img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(18, 55, 96, 0.25);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot-splash .dots {
        display: flex;
        gap: 6px;
      }
      #boot-splash .dots i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.25;
        animation: boot-dot 1s ease-in-out infinite;
      }
      #boot-splash .dots i:nth-child(2) {
        animation-delay: 0.15s;
      }
      #boot-splash .dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(1.06);
        }
      }
      @keyframes boot-dot {
        50% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      html.pr-miss #boot-splash {
        display: flex;
      }
      html.pr-miss #prerender {
        visibility: hidden;
      }
      html.app-ready #boot-bar,
      html.app-ready #boot-splash {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-bar::before,
        #boot-splash img,
        #boot-splash .dots i {
          animation: none;
        }
      }
    </style>
