# The 3-hour job sync: crawl → validate → commit data (only if it changed) → alert → build → deploy, all in
# one workflow (commits pushed with GITHUB_TOKEN do not trigger other workflows).
#
# Schedule: GitHub starts scheduled runs late (often 10–40 min) and sometimes drops them, so instead of a single
# 3-hourly cron the workflow checks every hour and crawls when the last crawl started ≥ ~3 hours ago. A late or
# missed tick is then made up within the hour. Manual runs (Actions → Crawl and deploy → Run workflow, or
# scripts/trigger-sync.sh) always crawl; code pushes only rebuild and redeploy.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Crawl and deploy

on:
  schedule:
    - cron: "17 * * * *" # hourly check; crawls only when a 3-hour sync is due (see the gate job)
  workflow_dispatch:
    inputs:
      only:
        description: "Crawl only these target ids (comma-separated). Empty = all."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "data/companies.json"
      - "data/overrides.json"
      - ".github/workflows/crawl-and-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl-and-deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Is a sync due?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crawl: ${{ steps.due.outputs.crawl }}
    steps:
      - name: Look up when the last crawl started
        id: last
        uses: actions/cache/restore@v4
        with:
          path: .last-crawl
          key: last-crawl-none # never saved: the prefix below finds the newest stamp
          restore-keys: last-crawl-
          lookup-only: true
      - name: Decide
        id: due
        env:
          EVENT: ${{ github.event_name }}
          MATCHED: ${{ steps.last.outputs.cache-matched-key }}
          SYNC_MINUTES: "180"
        run: |
          case "$EVENT" in
            push) echo "Code push: rebuild and redeploy without crawling."; echo "crawl=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            workflow_dispatch) echo "Manual run: crawl now."; echo "crawl=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          last=${MATCHED##last-crawl-}
          case "$last" in ''|*[!0-9]*) last=0 ;; esac
          age=$(( ($(date +%s) - last) / 60 ))
          # 10 minutes' tolerance so an on-time hourly tick isn't skipped by a few seconds.
          if [ "$age" -ge $(( SYNC_MINUTES - 10 )) ]; then crawl=true; else crawl=false; fi
          echo "Last crawl started ${age} min ago (sync every ${SYNC_MINUTES} min) → crawl=${crawl}"
          echo "crawl=${crawl}" >> "$GITHUB_OUTPUT"

  crawl-build:
    needs: gate
    if: needs.gate.outputs.crawl == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore HTTP cache (ETags)
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Crawl
        id: crawl
        # Code pushes only rebuild and redeploy; due scheduled runs and manual runs crawl.
        if: needs.gate.outputs.crawl == 'true'
        env:
          ONLY: ${{ inputs.only }}
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ -n "$ONLY" ]; then pnpm crawl --only "$ONLY"; else pnpm crawl; fi

      - name: Remember when this crawl started (drives the 3-hour schedule)
        if: steps.crawl.outcome == 'success' && inputs.only == ''
        run: mkdir -p .last-crawl && echo "${{ steps.crawl.outputs.started }}" > .last-crawl/started
      - uses: actions/cache/save@v4
        if: steps.crawl.outcome == 'success' && inputs.only == ''
        with:
          path: .last-crawl
          key: last-crawl-${{ steps.crawl.outputs.started }}

      - name: Save HTTP cache
        if: always() && steps.crawl.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: http-cache-${{ github.run_id }}

      - name: Validate all data against the schemas
        run: pnpm validate:data

      - name: Commit data
        if: steps.crawl.outputs.changed == 'true'
        env:
          MESSAGE: ${{ steps.crawl.outputs.message }}
        run: |
          git config user.name "rekiya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "$MESSAGE"
          git pull --rebase
          git push

      - name: Send alerts
        if: steps.crawl.outputs.changed == 'true' && steps.crawl.outputs.added != '0'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: pnpm --filter @rekiya/crawler notify

      - name: Build web app (copies /data into the build, prerenders every page, writes sitemap / llms.txt)
        env:
          # Optional repo variables (Settings → Secrets and variables → Actions → Variables):
          SITE_URL: ${{ vars.SITE_URL }} # custom domain, e.g. https://rekiya.lk (default: the GitHub Pages URL)
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }} # Search Console "HTML tag" content value
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }} # Bing Webmaster Tools msvalidate.01 value
        run: pnpm build

      - name: Keep the IndexNow URL list for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: apps/web/.seo/indexnow-urls.json
          include-hidden-files: true
          retention-days: 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: crawl-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing, Yandex, Seznam and Naver (IndexNow) about new job pages straight away.
      # Google reads the sitemap; submit it once in Search Console.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: indexnow-urls
      - name: Ping IndexNow
        continue-on-error: true
        env:
          SITE: ${{ vars.SITE_URL || 'https://vacancyfinder.github.io' }}
          KEY: 3c277cd06152b8097384b94d3edb0b3b
        run: |
          [ -f indexnow-urls.json ] || exit 0
          # IndexNow checks the key file on our site, so wait until the new deploy is actually being served.
          for i in $(seq 1 20); do
            [ "$(curl -fsS "$SITE/$KEY.txt" 2>/dev/null)" = "$KEY" ] && break
            echo "Waiting for $SITE/$KEY.txt to go live ($i)…"; sleep 15
          done
          HOST=$(echo "$SITE" | sed -E 's#^https?://##; s#/.*$##')
          jq -n --arg host "$HOST" --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --slurpfile urls indexnow-urls.json \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urls[0]}' > body.json
          echo "Submitting $(jq '.urlList | length' body.json) URLs"
          for attempt in 1 2; do
            code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST https://api.indexnow.org/indexnow \
              -H "content-type: application/json; charset=utf-8" --data @body.json)
            echo "IndexNow: HTTP $code $(cat resp.txt)"
            case "$code" in 200|202) exit 0 ;; esac
            sleep 60
          done
          echo "::warning::IndexNow did not accept the submission (HTTP $code)"
