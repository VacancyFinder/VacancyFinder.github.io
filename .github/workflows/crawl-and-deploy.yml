# The 3-hour job sync: crawl → validate → commit data (only if it changed) → alert → build → deploy → verify,
# all in one workflow (commits pushed with GITHUB_TOKEN do not trigger other workflows).
#
# Keeping the 3-hour rhythm. GitHub's cron is best-effort: it starts runs late and, on busy days, silently drops
# most of them (this repo saw 8 scheduled runs in 3 days from an hourly cron). So the schedule has two engines:
#   1. Sync timer (primary): every run ends by starting sync-timer.yml, which waits until the next sync is due
#      and then starts this workflow. Each sync schedules the next one, so no cron tick is needed.
#   2. Cron (backup): checks twice an hour and crawls only when a sync is overdue, and re-arms the timer if the
#      chain ever breaks (a cancelled run, a GitHub outage).
# The gate job decides from the time of the last successful crawl, so the two never crawl twice in a row.
#
# Failure handling. A failed or invalid crawl never reaches the site: the previous data is restored and
# redeployed, the run is marked failed, and a retry is scheduled in 45 minutes. Pages deploys retry while
# another deployment is in progress, and the live site is checked afterwards (and redeployed if needed).
# Manual runs (Actions → Crawl and deploy → Run workflow, or scripts/trigger-sync.sh) always crawl; code pushes
# only rebuild and redeploy. Public status: /status/ on the site.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Crawl and deploy

on:
  schedule:
    - cron: "17,47 * * * *" # backup check; crawls only when a sync is overdue (see the gate job)
  workflow_dispatch:
    inputs:
      only:
        description: "Crawl only these target ids (comma-separated). Empty = all."
        required: false
        default: ""
      reason:
        description: "manual = crawl now · timer = crawl if due (used by the sync timer) · retry = crawl now after a failure"
        required: false
        default: manual
  # Every push to main (code, docs, a README edit on github.com, a history rewrite) is followed by a rebuild, so
  # GitHub's legacy branch build — which runs on every push while Pages deploys from a branch — never stays live.
  # The bot's own data commits use GITHUB_TOKEN and don't trigger this, so there is no loop.
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write # start the sync timer

concurrency:
  group: crawl-and-deploy
  cancel-in-progress: false

env:
  SYNC_MINUTES: "180"
  RETRY_MINUTES: "45"
  SITE: ${{ vars.SITE_URL || 'https://vacancyfinder.github.io' }}

jobs:
  gate:
    name: Is a sync due?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crawl: ${{ steps.due.outputs.crawl }}
      last: ${{ steps.due.outputs.last }}
    steps:
      - name: Look up when the last successful crawl started
        id: last
        uses: actions/cache/restore@v4
        with:
          path: .last-crawl
          key: last-crawl-none # never saved: the prefix below finds the newest stamp
          restore-keys: last-crawl-
          lookup-only: true
      - name: Decide
        id: due
        env:
          EVENT: ${{ github.event_name }}
          REASON: ${{ inputs.reason || 'manual' }}
          MATCHED: ${{ steps.last.outputs.cache-matched-key }}
        run: |
          last=${MATCHED##last-crawl-}
          case "$last" in ''|*[!0-9]*) last=0 ;; esac
          echo "last=${last}" >> "$GITHUB_OUTPUT"
          age=$(( ($(date +%s) - last) / 60 ))
          echo "Last successful crawl started ${age} min ago (sync every ${SYNC_MINUTES} min)."
          if [ "$EVENT" = push ]; then
            echo "Code push: rebuild and redeploy without crawling."; crawl=false
          elif [ "$EVENT" = workflow_dispatch ] && [ "$REASON" != timer ]; then
            echo "Run requested ($REASON): crawl now."; crawl=true
          elif [ "$age" -ge $(( SYNC_MINUTES - 10 )) ]; then
            # 10 minutes' tolerance so an on-time tick isn't skipped by a few seconds.
            echo "Sync is due."; crawl=true
          else
            echo "Not due yet."; crawl=false
          fi
          echo "crawl=${crawl}" >> "$GITHUB_OUTPUT"

  crawl-build:
    needs: gate
    if: needs.gate.outputs.crawl == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      sync: ${{ steps.result.outputs.sync }}
      started: ${{ steps.crawl.outputs.started }}
      build-id: ${{ steps.build-id.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile || (sleep 30 && pnpm install --frozen-lockfile)

      - name: Restore HTTP cache (ETags)
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Crawl (one retry on failure)
        id: crawl
        if: needs.gate.outputs.crawl == 'true'
        continue-on-error: true
        timeout-minutes: 25
        env:
          ONLY: ${{ inputs.only }}
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          crawl() { if [ -n "$ONLY" ]; then pnpm crawl --only "$ONLY"; else pnpm crawl; fi; }
          crawl && exit 0
          echo "::warning::Crawl failed; retrying in 60 s with the previous data restored"
          git checkout -- data && git clean -fdq data
          sleep 60
          crawl

      - name: Validate all data against the schemas
        id: validate
        continue-on-error: true
        run: pnpm validate:data

      - name: Sync result
        id: result
        env:
          CRAWL: ${{ steps.crawl.outcome }}
          VALID: ${{ steps.validate.outcome }}
        run: |
          if [ "$CRAWL" = skipped ]; then sync=skipped
          elif [ "$CRAWL" = success ] && [ "$VALID" = success ]; then sync=ok
          else sync=failed; fi
          echo "sync=${sync}" >> "$GITHUB_OUTPUT"
          echo "Crawl: ${CRAWL} · validation: ${VALID} → sync ${sync}"
          if [ "$sync" = failed ] || [ "$VALID" != success ]; then
            # Never publish a partial or invalid crawl: go back to the last good data and redeploy that.
            echo "::error::Sync failed (crawl ${CRAWL}, validation ${VALID}). Keeping the previous data on the site."
            git checkout -- data && git clean -fdq data
            pnpm validate:data
          fi

      - name: Remember when this crawl started (drives the 3-hour schedule)
        if: steps.result.outputs.sync == 'ok' && inputs.only == ''
        run: mkdir -p .last-crawl && echo "${{ steps.crawl.outputs.started }}" > .last-crawl/started
      - uses: actions/cache/save@v4
        if: steps.result.outputs.sync == 'ok' && inputs.only == ''
        continue-on-error: true
        with:
          path: .last-crawl
          key: last-crawl-${{ steps.crawl.outputs.started }}

      - name: Save HTTP cache
        if: steps.result.outputs.sync == 'ok'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: http-cache-${{ github.run_id }}

      - name: Commit data
        id: commit
        if: steps.result.outputs.sync == 'ok' && steps.crawl.outputs.changed == 'true'
        continue-on-error: true
        env:
          MESSAGE: ${{ steps.crawl.outputs.message }}
        run: |
          git config user.name "rekiya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "$MESSAGE"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs && git push && exit 0
            echo "Push failed (attempt $i); retrying"; sleep $(( i * 10 ))
          done
          echo "::error::Couldn't push the new data; the site still gets it from this run"
          exit 1

      - name: Send alerts
        if: steps.commit.outcome == 'success' && steps.crawl.outputs.added != '0'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: pnpm --filter @rekiya/crawler notify

      - name: Check the Pages source
        id: pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "build_type=${type}" >> "$GITHUB_OUTPUT"
          if [ "$type" = legacy ]; then
            echo "::warning::Pages still deploys from a branch, which races this workflow on every data commit. Set Settings → Pages → Source: GitHub Actions."
            gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null 2>&1 \
              && echo "Switched the Pages source to GitHub Actions." && echo "build_type=workflow" >> "$GITHUB_OUTPUT" || true
          fi

      - name: Build id
        id: build-id
        run: echo "id=${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Build web app (copies /data into the build, prerenders every page, writes sitemap / llms.txt)
        env:
          # Optional repo variables (Settings → Secrets and variables → Actions → Variables):
          SITE_URL: ${{ vars.SITE_URL }} # custom domain, e.g. https://rekiya.lk (default: the GitHub Pages URL)
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }} # Search Console "HTML tag" content value
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }} # Bing Webmaster Tools msvalidate.01 value
          # Written to /build.json for the status page.
          BUILD_ID: ${{ steps.build-id.outputs.id }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_EVENT: ${{ github.event_name }}
          BUILD_SYNC: ${{ steps.result.outputs.sync }}
          BUILD_PAGES_SOURCE: ${{ steps.pages.outputs.build_type }}
        run: pnpm build

      - name: Keep the IndexNow URL list for the deploy job
        if: steps.result.outputs.sync == 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: apps/web/.seo/indexnow-urls.json
          include-hidden-files: true
          retention-days: 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: crawl-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BUILD_ID: ${{ needs.crawl-build.outputs.build-id }}
    steps:
      # Another Pages deployment (e.g. the legacy branch build) can be in progress: wait and retry.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait for the other deployment to finish
        if: steps.deployment.outcome == 'failure'
        run: sleep 150
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait again
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 240
      - id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # Make sure visitors actually get this build (a competing deployment can replace it a few minutes later).
      - name: Verify the live site
        id: verify
        continue-on-error: true
        run: |
          sleep 60
          for i in $(seq 1 12); do
            live=$(curl -fsS "$SITE/build.json?check=$(date +%s)" 2>/dev/null | jq -r .id 2>/dev/null || true)
            if [ "$live" = "$BUILD_ID" ]; then
              echo "Live site is serving build $BUILD_ID."
              sleep 180 # a racing legacy build finishes within ~3 minutes; check it didn't replace us
              live=$(curl -fsS "$SITE/build.json?check=$(date +%s)" 2>/dev/null | jq -r .id 2>/dev/null || true)
              [ "$live" = "$BUILD_ID" ] && exit 0
              echo "Build was replaced by '${live:-nothing}'."; exit 1
            fi
            echo "Live site serves '${live:-nothing}', waiting for $BUILD_ID ($i)…"; sleep 30
          done
          exit 1
      - id: redeploy
        if: steps.verify.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Verify again
        if: steps.verify.outcome == 'failure'
        run: |
          for i in $(seq 1 16); do
            sleep 30
            live=$(curl -fsS "$SITE/build.json?check=$(date +%s)" 2>/dev/null | jq -r .id 2>/dev/null || true)
            [ "$live" = "$BUILD_ID" ] && echo "Live site is serving build $BUILD_ID." && exit 0
          done
          echo "::error::The live site isn't serving this build. Check Settings → Pages → Source is 'GitHub Actions'."
          exit 1

      # Tell Bing, Yandex, Seznam and Naver (IndexNow) about new job pages straight away.
      # Google reads the sitemap; submit it once in Search Console.
      - uses: actions/download-artifact@v4
        if: needs.crawl-build.outputs.sync == 'ok'
        continue-on-error: true
        with:
          name: indexnow-urls
      - name: Ping IndexNow
        if: needs.crawl-build.outputs.sync == 'ok'
        continue-on-error: true
        env:
          KEY: 3c277cd06152b8097384b94d3edb0b3b
        run: |
          [ -f indexnow-urls.json ] || exit 0
          # IndexNow checks the key file on our site, so wait until the new deploy is actually being served.
          for i in $(seq 1 20); do
            [ "$(curl -fsS "$SITE/$KEY.txt" 2>/dev/null)" = "$KEY" ] && break
            echo "Waiting for $SITE/$KEY.txt to go live ($i)…"; sleep 15
          done
          HOST=$(echo "$SITE" | sed -E 's#^https?://##; s#/.*$##')
          jq -n --arg host "$HOST" --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --slurpfile urls indexnow-urls.json \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urls[0]}' > body.json
          echo "Submitting $(jq '.urlList | length' body.json) URLs"
          for attempt in 1 2; do
            code=$(curl -sS -o resp.txt -w "%{http_code}" -X POST https://api.indexnow.org/indexnow \
              -H "content-type: application/json; charset=utf-8" --data @body.json)
            echo "IndexNow: HTTP $code $(cat resp.txt)"
            case "$code" in 200|202) exit 0 ;; esac
            sleep 60
          done
          echo "::warning::IndexNow did not accept the submission (HTTP $code)"

  # Always runs: schedules the next sync (or a quick retry after a failure) and makes failures visible.
  next-sync:
    needs: [gate, crawl-build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CRAWL: ${{ needs.gate.outputs.crawl }}
      SYNC: ${{ needs.crawl-build.outputs.sync }}
      STARTED: ${{ needs.crawl-build.outputs.started }}
      LAST: ${{ needs.gate.outputs.last }}
      ONLY: ${{ inputs.only }}
      BUILD: ${{ needs.crawl-build.result }}
      DEPLOY: ${{ needs.deploy.result }}
    steps:
      - name: Schedule the next sync
        run: |
          now=$(date +%s)
          timer_running() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sync-timer.yml/runs?per_page=5" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 0
          }
          if [ "$CRAWL" = true ] && [ -z "$ONLY" ] && { [ "$SYNC" != ok ] || [ "$BUILD" != success ] || [ "$DEPLOY" != success ]; }; then
            due=$(( now + RETRY_MINUTES * 60 )); reason=retry
            echo "This sync failed: retrying in ${RETRY_MINUTES} min."
          elif [ "$SYNC" = ok ] && [ -z "$ONLY" ]; then
            due=$(( STARTED + SYNC_MINUTES * 60 )); reason=timer
          else
            # No crawl this run (not due, a code push, or a partial crawl): keep the existing timer if there is one.
            if [ "$(timer_running)" -gt 0 ]; then echo "The sync timer is already running."; exit 0; fi
            last=${LAST:-0}; [ "$last" -gt 0 ] || last=$now
            due=$(( last + SYNC_MINUTES * 60 )); reason=timer
            [ "$due" -gt "$now" ] || due=$(( now + 60 ))
          fi
          echo "Next sync: $(date -u -d "@$due" '+%Y-%m-%d %H:%M UTC') ($reason)"
          # Starting a new timer cancels the previous one (concurrency group), so there is only ever one.
          gh workflow run sync-timer.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME:-main}" \
            -f due_at="$due" -f reason="$reason"

      - name: Report the result
        run: |
          echo "Sync: ${SYNC:-not run} · build: ${BUILD} · deploy: ${DEPLOY}"
          fail=0
          [ "$SYNC" = failed ] && echo "::error::The crawl failed; the site kept the previous data. A retry is scheduled." && fail=1
          [ "$BUILD" = failure ] && echo "::error::The build failed; the site wasn't updated." && fail=1
          [ "$DEPLOY" = failure ] && echo "::error::Deploying to GitHub Pages failed." && fail=1
          exit $fail
